<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Methusala Jeeva's Data Analytics webinar experience and learning journey."
  >

  <meta name="theme-color" content="#070b1a">

  <title>Data Analytics | Methusala Jeeva</title>

  <style>
    /* =========================================================
       RESET
    ========================================================= */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 100px;
    }

    body {
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background: #060816;
      color: #f5f7ff;
      line-height: 1.7;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    ::selection {
      background: #7c5cff;
      color: white;
    }


    /* =========================================================
       BACKGROUND
    ========================================================= */

    body::before {
      content: "";
      position: fixed;
      inset: 0;

      background:
        radial-gradient(
          circle at 15% 10%,
          rgba(124, 92, 255, 0.16),
          transparent 28%
        ),
        radial-gradient(
          circle at 85% 25%,
          rgba(0, 210, 255, 0.11),
          transparent 25%
        ),
        radial-gradient(
          circle at 50% 80%,
          rgba(76, 54, 180, 0.12),
          transparent 30%
        );

      pointer-events: none;
      z-index: -2;
    }

    .grid-background {
      position: fixed;
      inset: 0;

      background-image:
        linear-gradient(
          rgba(255,255,255,0.025) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(255,255,255,0.025) 1px,
          transparent 1px
        );

      background-size: 55px 55px;
      mask-image: linear-gradient(
        to bottom,
        black,
        transparent 85%
      );

      pointer-events: none;
      z-index: -1;
    }


    /* =========================================================
       VARIABLES
    ========================================================= */

    :root {
      --bg: #060816;
      --bg-soft: #0b1024;

      --text: #f5f7ff;
      --muted: #a5aec8;

      --purple: #8b6cff;
      --purple-dark: #6547e9;

      --cyan: #3bdcff;

      --border: rgba(255,255,255,0.1);

      --glass: rgba(13,18,40,0.65);

      --max: 1180px;
    }


    /* =========================================================
       COMMON
    ========================================================= */

    .container {
      width: min(var(--max), calc(100% - 40px));
      margin: auto;
    }

    section {
      position: relative;
      padding: 120px 0;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;

      padding: 7px 13px;

      border: 1px solid rgba(139,108,255,0.3);
      border-radius: 999px;

      background: rgba(139,108,255,0.08);

      color: #c7bbff;

      font-size: 12px;
      font-weight: 700;

      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      content: "";
      width: 6px;
      height: 6px;

      border-radius: 50%;

      background: var(--cyan);

      box-shadow:
        0 0 12px var(--cyan);
    }

    .section-heading {
      max-width: 720px;
      margin-bottom: 55px;
    }

    .section-heading h2 {
      margin-top: 18px;

      font-size: clamp(36px, 5vw, 62px);
      line-height: 1.05;

      letter-spacing: -0.045em;
    }

    .section-heading p {
      margin-top: 20px;

      color: var(--muted);

      font-size: 17px;
    }


    /* =========================================================
       NAVIGATION
    ========================================================= */

    .nav-wrap {
      position: fixed;

      top: 18px;
      left: 0;
      right: 0;

      z-index: 1000;
    }

    nav {
      width: min(1050px, calc(100% - 30px));
      margin: auto;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 12px 14px 12px 20px;

      border: 1px solid var(--border);
      border-radius: 18px;

      background: rgba(7,11,26,0.7);

      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);

      box-shadow:
        0 20px 70px rgba(0,0,0,0.35);

      transition: 0.3s ease;
    }

    nav.scrolled {
      background: rgba(7,11,26,0.92);
      border-color: rgba(139,108,255,0.2);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 11px;

      font-weight: 800;
      letter-spacing: -0.03em;
    }

    .logo-mark {
      width: 34px;
      height: 34px;

      display: grid;
      place-items: center;

      border-radius: 11px;

      background:
        linear-gradient(
          135deg,
          var(--purple),
          var(--cyan)
        );

      color: white;

      box-shadow:
        0 0 25px rgba(124,92,255,0.3);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .nav-links a {
      padding: 9px 13px;

      border-radius: 10px;

      color: #aeb6cf;

      font-size: 13px;
      font-weight: 600;

      transition: 0.25s ease;
    }

    .nav-links a:hover,
    .nav-links a.active {
      color: white;
      background: rgba(255,255,255,0.07);
    }

    .nav-cta {
      padding: 10px 16px !important;

      color: white !important;

      background:
        linear-gradient(
          135deg,
          var(--purple),
          #6347e9
        ) !important;

      box-shadow:
        0 8px 25px rgba(124,92,255,0.25);
    }

    .menu-btn {
      display: none;

      width: 42px;
      height: 42px;

      border: 1px solid var(--border);
      border-radius: 12px;

      background: rgba(255,255,255,0.05);

      color: white;

      cursor: pointer;

      font-size: 20px;
    }


    /* =========================================================
       HERO
    ========================================================= */

    .hero {
      min-height: 100vh;

      display: flex;
      align-items: center;

      padding-top: 150px;
      padding-bottom: 90px;

      overflow: hidden;
    }

    .hero::before {
      content: "";

      position: absolute;

      width: 650px;
      height: 650px;

      top: -180px;
      right: -160px;

      background:
        radial-gradient(
          circle,
          rgba(124,92,255,0.22),
          transparent 68%
        );

      filter: blur(10px);

      animation: breathe 7s ease-in-out infinite;
    }

    .hero-content {
      display: grid;

      grid-template-columns:
        minmax(0, 1.15fr)
        minmax(350px, 0.85fr);

      gap: 70px;

      align-items: center;
    }

    .hero-copy {
      animation: heroIn 0.9s ease both;
    }

    .hero h1 {
      margin-top: 25px;

      max-width: 850px;

      font-size: clamp(
        52px,
        7.2vw,
        92px
      );

      line-height: 0.98;

      letter-spacing: -0.065em;
    }

    .gradient-text {
      background:
        linear-gradient(
          110deg,
          #ffffff 10%,
          #a996ff 48%,
          #55dcff 90%
        );

      -webkit-background-clip: text;
      background-clip: text;

      color: transparent;
    }

    .hero-description {
      max-width: 650px;

      margin-top: 28px;

      color: var(--muted);

      font-size: clamp(16px, 2vw, 19px);
    }

    .hero-date {
      margin-top: 18px;

      color: #c6cee3;

      font-size: 14px;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;

      gap: 13px;

      margin-top: 34px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;

      min-height: 50px;

      padding: 0 20px;

      border-radius: 13px;

      border: 1px solid var(--border);

      font-size: 14px;
      font-weight: 750;

      transition:
        transform 0.25s ease,
        box-shadow 0.25s ease,
        background 0.25s ease;
    }

    .btn:hover {
      transform: translateY(-3px);
    }

    .btn-primary {
      background:
        linear-gradient(
          135deg,
          #8b6cff,
          #6144e8
        );

      box-shadow:
        0 15px 35px rgba(124,92,255,0.25);
    }

    .btn-primary:hover {
      box-shadow:
        0 18px 45px rgba(124,92,255,0.38);
    }

    .btn-secondary {
      background: rgba(255,255,255,0.045);
    }

    .btn-secondary:hover {
      background: rgba(255,255,255,0.08);
    }


    /* =========================================================
       HERO VISUAL
    ========================================================= */

    .hero-visual {
      min-height: 510px;

      position: relative;

      display: grid;
      place-items: center;

      animation:
        visualIn 1s 0.2s ease both;
    }

    .visual-glow {
      position: absolute;

      width: 300px;
      height: 300px;

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(139,108,255,0.32),
          transparent 70%
        );

      filter: blur(15px);

      animation:
        float 5s ease-in-out infinite;
    }

    .orbit {
      position: absolute;

      width: 350px;
      height: 350px;

      border: 1px solid rgba(139,108,255,0.25);

      border-radius: 50%;

      transform: rotateX(65deg) rotateZ(-20deg);

      animation:
        orbitSpin 14s linear infinite;
    }

    .orbit::before,
    .orbit::after {
      content: "";

      position: absolute;

      width: 12px;
      height: 12px;

      border-radius: 50%;

      background: var(--cyan);

      box-shadow:
        0 0 25px var(--cyan);
    }

    .orbit::before {
      top: 35px;
      left: 50%;
    }

    .orbit::after {
      bottom: 30px;
      right: 20%;
      background: var(--purple);
      box-shadow:
        0 0 25px var(--purple);
    }

    .data-card {
      position: relative;

      width: 310px;

      padding: 27px;

      border: 1px solid rgba(255,255,255,0.13);
      border-radius: 25px;

      background:
        linear-gradient(
          145deg,
          rgba(28,35,70,0.8),
          rgba(11,16,37,0.7)
        );

      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);

      box-shadow:
        0 35px 80px rgba(0,0,0,0.4),
        inset 0 1px rgba(255,255,255,0.1);

      transform:
        perspective(1000px)
        rotateY(-8deg)
        rotateX(5deg);

      animation:
        cardFloat 6s ease-in-out infinite;
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;

      margin-bottom: 28px;
    }

    .card-label {
      color: #8e99b6;

      font-size: 11px;

      text-transform: uppercase;
      letter-spacing: 0.13em;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 6px;

      color: #8df0d0;

      font-size: 11px;
    }

    .status::before {
      content: "";

      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: #62e8bb;

      box-shadow:
        0 0 10px #62e8bb;
    }

    .chart {
      height: 145px;

      display: flex;
      align-items: end;
      gap: 8px;

      padding: 15px 5px;

      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .bar {
      flex: 1;

      min-height: 20px;

      border-radius: 7px 7px 2px 2px;

      background:
        linear-gradient(
          to top,
          #6046df,
          #58dfff
        );

      opacity: 0.85;

      animation: bars 1.5s ease both;
    }

    .bar:nth-child(1) { height: 35%; }
    .bar:nth-child(2) { height: 55%; }
    .bar:nth-child(3) { height: 42%; }
    .bar:nth-child(4) { height: 72%; }
    .bar:nth-child(5) { height: 64%; }
    .bar:nth-child(6) { height: 91%; }
    .bar:nth-child(7) { height: 76%; }

    .card-bottom {
      display: flex;
      justify-content: space-between;

      padding-top: 22px;
    }

    .metric strong {
      display: block;

      font-size: 25px;
      letter-spacing: -0.04em;
    }

    .metric span {
      color: #8993ae;

      font-size: 10px;
      text-transform: uppercase;
    }

    .floating-pill {
      position: absolute;

      padding: 11px 15px;

      border: 1px solid rgba(255,255,255,0.11);
      border-radius: 13px;

      background: rgba(11,16,37,0.78);

      backdrop-filter: blur(15px);

      box-shadow:
        0 15px 35px rgba(0,0,0,0.25);

      color: #cbd3e8;

      font-size: 11px;
      font-weight: 700;

      animation: float 4s ease-in-out infinite;
    }

    .pill-one {
      top: 65px;
      right: 15px;
    }

    .pill-two {
      bottom: 75px;
      left: 5px;

      animation-delay: -1.5s;
    }


    /* =========================================================
       INTRO
    ========================================================= */

    .intro-grid {
      display: grid;

      grid-template-columns:
        0.7fr
        1.3fr;

      gap: 80px;
    }

    .big-number {
      font-size: clamp(90px, 13vw, 180px);

      line-height: 0.8;

      letter-spacing: -0.08em;

      background:
        linear-gradient(
          135deg,
          rgba(139,108,255,0.8),
          rgba(59,220,255,0.2)
        );

      -webkit-background-clip: text;
      background-clip: text;

      color: transparent;
    }

    .intro-content h3 {
      font-size: clamp(28px, 4vw, 43px);

      line-height: 1.1;

      letter-spacing: -0.04em;
    }

    .intro-content p {
      margin-top: 20px;

      color: var(--muted);

      font-size: 17px;
    }

    .intro-note {
      margin-top: 30px;

      padding: 20px;

      border-left: 2px solid var(--purple);

      background:
        linear-gradient(
          90deg,
          rgba(139,108,255,0.09),
          transparent
        );

      color: #cbd2e6;
    }


    /* =========================================================
       LEARNING CARDS
    ========================================================= */

    .learning-grid {
      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 18px;
    }

    .learning-card {
      position: relative;

      min-height: 310px;

      padding: 30px;

      border: 1px solid var(--border);
      border-radius: 23px;

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,0.055),
          rgba(255,255,255,0.018)
        );

      overflow: hidden;

      transition:
        transform 0.35s ease,
        border-color 0.35s ease,
        background 0.35s ease;
    }

    .learning-card::before {
      content: "";

      position: absolute;

      width: 170px;
      height: 170px;

      top: -80px;
      right: -70px;

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(124,92,255,0.22),
          transparent 70%
        );
    }

    .learning-card:hover {
      transform: translateY(-8px);

      border-color:
        rgba(139,108,255,0.35);

      background:
        linear-gradient(
          145deg,
          rgba(139,108,255,0.09),
          rgba(255,255,255,0.025)
        );
    }

    .card-number {
      color: #8f7aff;

      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.08em;
    }

    .learning-card h3 {
      margin-top: 60px;

      font-size: 27px;

      letter-spacing: -0.035em;
    }

    .learning-card p {
      margin-top: 14px;

      color: var(--muted);

      font-size: 14px;
    }

    .arrow {
      position: absolute;

      right: 28px;
      bottom: 25px;

      width: 38px;
      height: 38px;

      display: grid;
      place-items: center;

      border: 1px solid var(--border);
      border-radius: 50%;

      color: #9e91ff;

      transition: 0.3s ease;
    }

    .learning-card:hover .arrow {
      transform: rotate(-45deg);

      background: var(--purple);
      color: white;
    }


    /* =========================================================
       QUOTE
    ========================================================= */

    .quote-section {
      padding: 100px 0;
    }

    .quote-box {
      position: relative;

      padding: clamp(35px, 7vw, 85px);

      border: 1px solid rgba(139,108,255,0.2);
      border-radius: 30px;

      background:
        radial-gradient(
          circle at 10% 20%,
          rgba(139,108,255,0.13),
          transparent 30%
        ),
        radial-gradient(
          circle at 90% 80%,
          rgba(59,220,255,0.08),
          transparent 30%
        ),
        rgba(255,255,255,0.025);

      overflow: hidden;
    }

    .quote-mark {
      position: absolute;

      top: 10px;
      left: 30px;

      color: rgba(139,108,255,0.2);

      font-family: Georgia, serif;

      font-size: 130px;

      line-height: 1;
    }

    blockquote {
      position: relative;

      max-width: 850px;

      font-size: clamp(
        28px,
        4.5vw,
        52px
      );

      line-height: 1.12;

      letter-spacing: -0.045em;

      font-weight: 650;
    }

    .quote-author {
      margin-top: 30px;

      color: #8f9ab8;

      font-size: 13px;
    }


    /* =========================================================
       EXPERIENCE / STATS
    ========================================================= */

    .experience-grid {
      display: grid;

      grid-template-columns:
        1.2fr
        0.8fr;

      gap: 20px;
    }

    .experience-card {
      padding: 35px;

      border: 1px solid var(--border);
      border-radius: 24px;

      background: rgba(255,255,255,0.03);
    }

    .experience-card h3 {
      font-size: 30px;

      letter-spacing: -0.04em;
    }

    .experience-card p {
      margin-top: 15px;

      color: var(--muted);
    }

    .stats {
      display: grid;

      grid-template-columns:
        repeat(2, 1fr);

      gap: 12px;
    }

    .stat {
      padding: 25px;

      border: 1px solid var(--border);
      border-radius: 18px;

      background: rgba(255,255,255,0.025);
    }

    .stat strong {
      display: block;

      font-size: 38px;

      letter-spacing: -0.06em;

      background:
        linear-gradient(
          135deg,
          white,
          #8f7aff
        );

      -webkit-background-clip: text;
      background-clip: text;

      color: transparent;
    }

    .stat span {
      color: #8e98b3;

      font-size: 12px;
    }


    /* =========================================================
       NEXT STEP CTA
    ========================================================= */

    .next-section {
      padding-top: 90px;
      padding-bottom: 130px;
    }

    .next-box {
      position: relative;

      text-align: center;

      padding: 85px 30px;

      background:

          rgba(59,220,255,0.055)
        );

      overflow: hidden;
    }

    .next-box::before {

    .next-box > * {

    .next-box h2 {
